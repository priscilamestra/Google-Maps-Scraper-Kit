[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "google-maps-scraper-kit"
version = "0.2.0"
description = "Local Google Maps business extraction and institutional website enrichment"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.64.1",
]

[project.scripts]
gmaps = "google_maps_scraper_kit.launcher:run"
google-maps-scraper-kit = "google_maps_scraper_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
google_maps_scraper_kit = ["static/*"]
