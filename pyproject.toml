[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leads-prospect-ai"
version = "0.1.0"
description = "Low-cost lead discovery and qualification foundation"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
leads-prospect = "leads_prospect_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
